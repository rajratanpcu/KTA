name: KTA ERP - Build, Test & CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend CI (Spring Boot 3 & Tests)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Backend Unit Tests
        run: |
          cd backend
          mvn clean test --batch-mode

  frontend-ci:
    name: Frontend CI (React, TypeScript & Build)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Checking
        run: |
          cd frontend
          npm run typecheck

      - name: Production Vite Build
        run: |
          cd frontend
          npm run build

      - name: ESLint
        run: |
          cd frontend
          npm run lint
