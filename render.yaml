# Render Infrastructure as Code Blueprint
# Free-tier cloud deploy: PostgreSQL Database + Spring Boot API Service
# Render automatically provisions and links the PostgreSQL database to the backend!

databases:
  - name: kta-erp-postgres
    plan: free
    region: oregon
    databaseName: kta_erp
    user: kta_admin

services:
  # Backend API Web Service
  - type: web
    name: kta-erp-backend
    runtime: java
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: java -jar backend/target/kta-erp-1.0.0.jar
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: kta-erp-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: kta-erp-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: kta-erp-postgres
          property: password
      - key: DB_MAX_POOL_SIZE
        value: "5"
      - key: DB_MIN_IDLE
        value: "2"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/kta-uploads
