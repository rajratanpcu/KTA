version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kta-erp-postgres
    environment:
      POSTGRES_DB: kta_erp
      POSTGRES_USER: kta
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kta -d kta_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kta-erp-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kta_erp
      SPRING_DATASOURCE_USERNAME: kta
      SPRING_DATASOURCE_PASSWORD: changeme
      DB_PASSWORD: changeme
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kta-erp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080

volumes:
  postgres_data:
    driver: local
